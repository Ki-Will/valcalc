[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valcalc"
version = "0.1.0"
description = "Tiny validation + calculator toolkit for numeric input."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["validation", "calculator", "numbers", "money"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://test.pypi.org/project/valcalc/"

[tool.setuptools.packages.find]
include = ["valcalc*"]
